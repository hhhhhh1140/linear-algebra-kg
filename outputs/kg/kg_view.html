<style>

      --accent: #8fb3ef; --seed: #77766f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a2a19b; --border: #34332f;
    --accent: #8fb3ef; --seed: #77766f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px; }
  h2 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0; cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .line { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
  .stats { font-size: 12px; color: var(--muted); }
  #detail { font-size: 13px; line-height: 1.6; }
  #detail .name { font-size: 16px; font-weight: 600; }
  #detail ul { padding-left: 16px; margin: 4px 0; }
  #detail .tag { font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  #net { width: 100%; height: 100vh; }
  body.embed .app { grid-template-columns: 1fr; }
  body.embed aside { display: none; }
  #legend { display: none; position: absolute; top: 16px; left: 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.7; box-shadow: 0 2px 10px rgba(0,0,0,.06); z-index: 5; }
  body.embed #legend { display: block; }
  #legend .t { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  #legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #legend span.item { display: inline-flex; align-items: center; gap: 5px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 16px; }
    #net { height: 70vh; }
  }
</style>
</head>

"方阵"}, {"head": "若尔当块", "relation": "is_a", "tail": "方阵", "source": "inferred", "rule": "R1", "via": "三角矩阵"}, {"head": "若尔当块", "relation": "is_a", "tail": "矩阵", "source": "inferred", "rule": "R1", "via": "三角矩阵"}, {"head": "格拉姆矩阵", "relation": "is_a", "tail": "对称矩阵", "source": "inferred", "rule": "R1", "via": "半正定矩阵"}, {"head": "格拉姆矩阵", "relation": "is_a", "tail": "埃尔米特矩阵", "source": "inferred", "rule": "R1", "via": "半正定矩阵"}, {"head": "格拉姆矩阵", "relation": "has_property", "tail": "可对角化", "source": "inferred", "rule": "R2", "via": "半正定矩阵"}, {"head": "格拉姆矩阵", "relation": "has_property", "tail": "特征值全为实数", "source": "inferred", "rule": "R2", "via": "半正定矩阵"}, {"head": "格拉姆矩阵", "relation": "is_a", "tail": "方阵", "source": "inferred", "rule": "R1", "via": "实对称矩阵"}, {"head": "格拉姆矩阵", "relation": "has_property", "tail": "对称性", "source": "inferred", "rule": "R2", "via": "实对称矩阵"}, {"head": "正交投影", "relation": "has_property", "tail": "线性性", "source": "inferred", "rule": "R2", "via": "线性映射"}, {"head": "若尔当标准形", "relation": "is_a", "tail": "方阵", "source": "inferred", "rule": "R1", "via": "三角矩阵"}, {"head": "若尔当标准形", "relation": "is_a", "tail": "矩阵", "source": "inferred", "rule": "R1", "via": "三角矩阵"}, {"head": "实对称矩阵", "relation": "is_a", "tail": "矩阵", "source": "inferred", "rule": "R1", "via": "方阵"}, {"head": "格拉姆矩阵", "relation": "is_a", "tail": "矩阵", "source": "inferred", "rule": "R1", "via": "实对称矩阵"}, {"head": "希尔伯特矩阵", "relation": "has_property", "tail": "对称性", "source": "inferred", "rule": "R2", "via": "实对称矩阵"}], "types": {"CON": "概念", "THM": "定理", "PROP": "性质", "OP": "运算", "METH": "方法"}, "relations": {"is_a": "上位概念", "part_of": "组成部分", "depends_on": "定义依赖", "has_property": "具有性质", "equivalent_to": "等价", "solved_by": "求解方法", "acts_on": "作用对象", "yields": "得到结果", "involves": "定理涉及"}};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SRC_ZH = { seed: "人工种子", extracted: "模型抽取", inferred: "规则推理" };
// URL 参数：?focus=实体名&hops=1 只显示该实体的邻域；&embed=1 隐藏侧栏（用于截图）；&labels=1 强制显示边上的关系名
const P = new URLSearchParams(location.search);
const FOCUS = P.get("focus"), HOPS = parseInt(P.get("hops") || "1", 10);
if (P.get("embed") === "1") document.body.classList.add("embed");
// &src=seed,extracted 只显示指定来源的三元组
const SRC_FILTER = P.get("src") ? new Set(P.get("src").split(",")) : null;
const state = { types: new Set(Object.keys(DATA.types)), sources: new Set(Object.keys(SRC_ZH)),
                rels: new Set(Object.keys(DATA.relations)) };

function checkbox(container, key, label, swatch, set) {
  const el = document.createElement("label");
  el.innerHTML = `<input type="checkbox" checked> ${swatch} ${label}`;
  el.querySelector("input").onchange = e => { e.target.checked ? set.add(key) : set.delete(key); refresh(); };
  container.appendChild(el);
}
for (const [k, v] of Object.entries(DATA.types))
  checkbox(document.getElementById("types"), k, `${v}（${k}）`, `<span class="dot" style="background:${css("--" + k)}"></span>`, state.types);
for (const [k, v] of Object.entries(SRC_ZH))
  checkbox(document.getElementById("sources"), k, v, `<span class="line" style="border-color:${css("--" + k)};${k === "inferred" ? "border-top-style:dashed" : ""}"></span>`, state.sources);
for (const [k, v] of Object.entries(DATA.relations))
  checkbox(document.getElementById("rels"), k, `${v} <span class="stats">${k}</span>`, "", state.rels);

const counts = DATA.edges.reduce((m, e) => (m[e.source] = (m[e.source] || 0) + 1, m), {});
document.getElementById("stats").textContent =
  `${DATA.nodes.length} 个实体 · ${DATA.edges.length} 条三元组（种子 ${counts.seed || 0} / 抽取 ${counts.extracted || 0} / 推理 ${counts.inferred || 0}）`;
document.getElementById("names").innerHTML = DATA.nodes.map(n => `<option value="${n.name}">`).join("");

const nodes = new vis.DataSet(), edges = new vis.DataSet();
const net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
  physics: { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -60, springLength: 90 },
             stabilization: { iterations: 250 } },
  nodes: { shape: "dot", size: 12, font: { size: 13, color: css("--text") }, borderWidth: 1 },
  edges: { arrows: { to: { enabled: true, scaleFactor: 0.5 } }, font: { size: 10, color: css("--muted"), strokeWidth: 0, align: "middle" },
           smooth: { type: "continuous" }, width: 1.2 },
  interaction: { hover: true, tooltipDelay: 120 },
});

function refresh() {
  const visibleNodes = DATA.nodes.filter(n => state.types.has(n.type));
  const ok = new Set(visibleNodes.map(n => n.name));
  let visibleEdges = DATA.edges.filter(e => state.sources.has(e.source) && (!SRC_FILTER || SRC_FILTER.has(e.source)) &&
    state.rels.has(e.relation) && ok.has(e.head) && ok.has(e.tail));
  let shown = visibleNodes;
  if (FOCUS) {
    const keep = new Set([FOCUS]);
    for (let h = 0; h < HOPS; h++) {
      const frontier = new Set(keep);
      visibleEdges.forEach(e => { if (frontier.has(e.head)) keep.add(e.tail); if (frontier.has(e.tail)) keep.add(e.head); });
    }
    shown = visibleNodes.filter(n => keep.has(n.name));
    // 一跳邻域只画与中心实体直接相连的边（星形），多跳时画子图内全部边
    visibleEdges = visibleEdges.filter(e => HOPS === 1 ? (e.head === FOCUS || e.tail === FOCUS)
                                                       : (keep.has(e.head) && keep.has(e.tail)));
  }
  const showLabels = P.get("labels") === "1" || shown.length <= 45;
  // 一跳邻域：中心实体居中，邻居按关系类型分组排成一圈（确定性布局，不用物理模拟）
  const STAR = FOCUS && HOPS === 1;
  const pos = {};
  if (STAR) {
    const relOf = {};
    visibleEdges.forEach(e => { const o = e.head === FOCUS ? e.tail : e.head; relOf[o] = relOf[o] || (e.relation + (e.head === FOCUS ? ">" : "<")); });
    const ring = shown.filter(n => n.name !== FOCUS).sort((a, b) => (relOf[a.name] + a.name).localeCompare(relOf[b.name] + b.name));
    const R = Math.max(260, ring.length * 26);
    ring.forEach((n, i) => { const t = 2 * Math.PI * i / ring.length - Math.PI / 2; pos[n.name] = { x: R * Math.cos(t), y: R * Math.sin(t) }; });
    pos[FOCUS] = { x: 0, y: 0 };
    net.setOptions({ physics: false, edges: { smooth: false, font: { size: 14, align: "horizontal", background: css("--bg") } } });
  }
  const deg = {};
  visibleEdges.forEach(e => { deg[e.head] = (deg[e.head] || 0) + 1; deg[e.tail] = (deg[e.tail] || 0) + 1; });
  nodes.clear(); edges.clear();
  nodes.add(shown.map(n => ({ id: n.name, label: n.name, ...(pos[n.name] || {}),
    size: n.name === FOCUS ? 34 : (FOCUS ? 14 : 8) + Math.min(deg[n.name] || 0, 20),
    font: n.name === FOCUS ? { size: 20, bold: true } : (FOCUS ? { size: 15 } : undefined),
    color: { background: css("--" + n.type), border: n.source === "extracted" ? css("--extracted") : css("--" + n.type) },
    borderWidth: n.source === "extracted" ? 3 : 1,
    title: `${n.name}｜${DATA.types[n.type]}${n.source === "extracted" ? "｜模型新发现" : ""}` })));
  edges.add(visibleEdges.map((e, i) => ({ id: i, from: e.head, to: e.tail,
    label: showLabels ? DATA.relations[e.relation] : undefined,
    color: { color: css("--" + e.source), opacity: 0.85 }, dashes: e.source === "inferred",
    title: `${e.head} —${DATA.relations[e.relation]}→ ${e.tail}\n来源：${SRC_ZH[e.source]}` +
           (e.score ? `\n置信度：${e.score}` : "") + (e.rule ? `\n规则：${e.rule}${e.via ? "（经由 " + e.via + "）" : ""}` : "") })));
}
refresh();
let settled = false;
function settle() {
  if (settled) return;
  settled = true;
  net.setOptions({ physics: false });
  net.fit({ animation: false });
  document.body.dataset.ready = "1";
}
net.once("stabilizationIterationsDone", settle);
net.once("stabilized", settle);
setTimeout(settle, 4000);
if (FOCUS && HOPS === 1) settle();

// 悬浮图例（embed 模式）
{
  const sw = k => `<span class="dot" style="background:${css("--" + k)}"></span>`;
  const ln = k => `<span class="line" style="border-color:${css("--" + k)};${k === "inferred" ? "border-top-style:dashed" : ""}"></span>`;
  const shownN = nodes.length, shownE = edges.length;
  document.getElementById("legend").innerHTML =
    `<div class="t">${FOCUS ? "「" + FOCUS + "」" + (HOPS > 1 ? HOPS + " 跳" : "") + "邻域" : "线性代数知识图谱"}</div>` +
    `<div class="stats">${shownN} 个实体 · ${shownE} 条三元组</div>` +
    `<div class="row">${Object.entries(DATA.types).map(([k, v]) => `<span class="item">${sw(k)}${v}</span>`).join("")}</div>` +
    `<div class="row">${Object.entries(SRC_ZH).map(([k, v]) => `<span class="item">${ln(k)}${v}</span>`).join("")}</div>`;
}

function showDetail(name) {
  const n = DATA.nodes.find(x => x.name === name);
  if (!n) return;
  const row = e => `<li>${e.head === name ? "" : e.head + " "}<b>${DATA.relations[e.relation]}</b> ${e.tail === name ? "" : e.tail}
    <span class="tag">${SRC_ZH[e.source]}${e.score ? " " + e.score : ""}${e.rule ? " " + e.rule : ""}</span></li>`;
  const out = DATA.edges.filter(e => e.head === name), inc = DATA.edges.filter(e => e.tail === name);
  document.getElementById("detail").innerHTML =
    `<div class="name">${name}</div><div class="stats">${DATA.types[n.type]}${n.source === "extracted" ? " · 模型新发现" : ""}</div>` +
    `<h2>出边（${out.length}）</h2><ul>${out.map(row).join("")}</ul><h2>入边（${inc.length}）</h2><ul>${inc.map(row).join("")}</ul>`;
}
net.on("click", p => { if (p.nodes.length) showDetail(p.nodes[0]); });
document.getElementById("q").addEventListener("change", e => {
  const v = e.target.value.trim();
  if (nodes.get(v)) { net.selectNodes([v]); net.focus(v, { scale: 1.4, animation: true }); showDetail(v); }
});
</script>
